<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maberyk</title>
<style>
  :root {
    --bg: #14161b;
    --panel: #1c1f26;
    --panel-border: #2a2e37;
    --text: #e4e7ec;
    --muted: #8a919e;
    --accent: #4c8cf5;
    --agent-bubble: #262b34;
    --user-bubble: #2a4d8f;
    --question-bubble: #123539;
    --question-border: #46d6dc;
    --curiosity: #50dce6;
    --fear: #eb4848;
    --confidence: #5ad27d;
    --confusion: #ebd250;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 14px 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  #step-counter {
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
  }

  #dominant-emotion {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    background: #2a2e37;
    color: var(--text);
    white-space: nowrap;
  }

  .emotion-bars {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    flex: 1;
    min-width: 260px;
  }

  .emotion-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
  }

  .emotion-bar .track {
    width: 64px;
    height: 6px;
    border-radius: 3px;
    background: #30343d;
    overflow: hidden;
  }

  .emotion-bar .fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .emotion-bar .value {
    width: 30px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  #toggle-panel {
    margin-left: auto;
    background: none;
    border: 1px solid var(--panel-border);
    color: var(--muted);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  #toggle-panel:hover { color: var(--text); border-color: var(--accent); }

  .body-layout {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bubble-row {
    display: flex;
    width: 100%;
  }
  .bubble-row.user { justify-content: flex-end; }
  .bubble-row.agent { justify-content: flex-start; }

  .bubble {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }

  .bubble.user {
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
  }

  .bubble.agent {
    background: var(--agent-bubble);
    border-bottom-left-radius: 4px;
  }

  .bubble.question {
    background: var(--question-bubble);
    border: 1px solid var(--question-border);
    border-bottom-left-radius: 4px;
  }

  .bubble.thinking {
    background: var(--agent-bubble);
    color: var(--muted);
    font-style: italic;
    border-bottom-left-radius: 4px;
  }

  .branch-tag {
    display: inline-block;
    margin-top: 6px;
    font-size: 10px;
    letter-spacing: 0.3px;
    color: var(--muted);
    opacity: 0.7;
    text-transform: uppercase;
  }

  #input-bar {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    background: var(--panel);
    border-top: 1px solid var(--panel-border);
    flex-shrink: 0;
  }

  #text-input {
    flex: 1;
    background: #101317;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
  }
  #text-input:focus { border-color: var(--accent); }

  #send-button {
    background: var(--accent);
    border: none;
    color: white;
    padding: 0 20px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  #send-button:disabled {
    background: #33394a;
    cursor: not-allowed;
  }

  #side-panel {
    width: 280px;
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--panel-border);
    padding: 16px;
    overflow-y: auto;
    transition: margin-right 0.2s ease;
  }
  #side-panel.collapsed {
    margin-right: -280px;
  }

  #side-panel h2 {
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0 0 12px 0;
  }

  #inner-voice-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .thought {
    font-size: 12px;
    color: var(--text);
    background: #232833;
    border-radius: 8px;
    padding: 8px 10px;
    line-height: 1.4;
  }

  #chat::-webkit-scrollbar, #side-panel::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb, #side-panel::-webkit-scrollbar-thumb {
    background: #2c313b;
    border-radius: 4px;
  }
</style>
</head>
<body>

<header>
  <h1>Maberyk</h1>
  <span id="step-counter">pasos: 0</span>
  <span id="dominant-emotion">—</span>
  <div class="emotion-bars">
    <div class="emotion-bar">
      <span>curiosidad</span>
      <div class="track"><div class="fill" id="bar-curiosity" style="background: var(--curiosity); width:0%"></div></div>
      <span class="value" id="val-curiosity">0.00</span>
    </div>
    <div class="emotion-bar">
      <span>miedo</span>
      <div class="track"><div class="fill" id="bar-fear" style="background: var(--fear); width:0%"></div></div>
      <span class="value" id="val-fear">0.00</span>
    </div>
    <div class="emotion-bar">
      <span>confianza</span>
      <div class="track"><div class="fill" id="bar-confidence" style="background: var(--confidence); width:0%"></div></div>
      <span class="value" id="val-confidence">0.00</span>
    </div>
    <div class="emotion-bar">
      <span>confusion</span>
      <div class="track"><div class="fill" id="bar-confusion" style="background: var(--confusion); width:0%"></div></div>
      <span class="value" id="val-confusion">0.00</span>
    </div>
  </div>
  <button id="toggle-panel">pensamientos ▸</button>
</header>

<div class="body-layout">
  <main>
    <div id="chat"></div>
    <div id="input-bar">
      <input id="text-input" type="text" placeholder="Escribele a Maberyk..." autocomplete="off">
      <button id="send-button">Enviar</button>
    </div>
  </main>
  <aside id="side-panel" class="collapsed">
    <h2>Voz interior reciente</h2>
    <div id="inner-voice-list"></div>
  </aside>
</div>

<script>
(function () {
  const chat = document.getElementById("chat");
  const textInput = document.getElementById("text-input");
  const sendButton = document.getElementById("send-button");
  const sidePanel = document.getElementById("side-panel");
  const togglePanelButton = document.getElementById("toggle-panel");

  let lastRenderedQuestion = null;
  let sending = false;

  togglePanelButton.addEventListener("click", () => {
    const collapsed = sidePanel.classList.toggle("collapsed");
    togglePanelButton.textContent = collapsed ? "pensamientos ▸" : "pensamientos ▾";
  });

  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function addBubble(sender, text, opts) {
    opts = opts || {};
    const row = document.createElement("div");
    row.className = "bubble-row " + (sender === "user" ? "user" : "agent");

    const bubble = document.createElement("div");
    let bubbleClass = sender === "user" ? "user" : "agent";
    if (opts.question) bubbleClass = "question";
    if (opts.thinking) bubbleClass = "thinking";
    bubble.className = "bubble " + bubbleClass;
    bubble.textContent = text;

    if (opts.branch) {
      const tag = document.createElement("div");
      tag.className = "branch-tag";
      tag.textContent = opts.branch;
      bubble.appendChild(tag);
    }

    row.appendChild(bubble);
    chat.appendChild(row);
    scrollToBottom();
    return bubble;
  }

  async function sendMessage() {
    const text = textInput.value.trim();
    if (!text || sending) return;

    sending = true;
    sendButton.disabled = true;
    textInput.value = "";

    addBubble("user", text);
    const thinkingBubble = addBubble("agent", "Maberyk esta pensando...", { thinking: true });

    try {
      const res = await fetch("/message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text }),
      });
      const data = await res.json();

      thinkingBubble.parentElement.remove();
      if (data.reply) {
        addBubble("agent", data.reply, { branch: data.branch });
      } else {
        addBubble("agent", "(sin respuesta esta vez)", { branch: data.branch });
      }
    } catch (err) {
      thinkingBubble.parentElement.remove();
      addBubble("agent", "No pude conectar con Maberyk.", {});
    } finally {
      sending = false;
      sendButton.disabled = false;
      textInput.focus();
    }
  }

  sendButton.addEventListener("click", sendMessage);
  textInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      sendMessage();
    }
  });

  function updateEmotionBar(name, value) {
    const pct = Math.max(0, Math.min(1, value)) * 100;
    document.getElementById("bar-" + name).style.width = pct + "%";
    document.getElementById("val-" + name).textContent = value.toFixed(2);
  }

  function updateInnerVoice(thoughts) {
    const list = document.getElementById("inner-voice-list");
    list.innerHTML = "";
    thoughts.forEach((thought) => {
      const item = document.createElement("div");
      item.className = "thought";
      item.textContent = thought;
      list.appendChild(item);
    });
  }

  function updatePendingQuestion(question) {
    if (!question || question === lastRenderedQuestion) return;
    lastRenderedQuestion = question;
    addBubble("agent", question, { question: true });
  }

  async function refreshState() {
    try {
      const res = await fetch("/state");
      if (!res.ok) return;
      const data = await res.json();

      document.getElementById("step-counter").textContent = "pasos: " + data.steps;
      document.getElementById("dominant-emotion").textContent = data.dominant_emotion;

      const emotions = data.emotions || {};
      updateEmotionBar("curiosity", emotions.curiosity || 0);
      updateEmotionBar("fear", emotions.fear || 0);
      updateEmotionBar("confidence", emotions.confidence || 0);
      updateEmotionBar("confusion", emotions.confusion || 0);

      updateInnerVoice(data.inner_voice || []);
      updatePendingQuestion(data.pending_question);
    } catch (err) {
      // Server not reachable this tick — next poll will retry.
    }
  }

  refreshState();
  setInterval(refreshState, 2000);
  textInput.focus();
})();
</script>

</body>
</html>
